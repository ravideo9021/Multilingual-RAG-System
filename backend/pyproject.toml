[project]
name = "multilingual-rag-backend"
version = "0.1.0"
description = "Hindi-English cross-lingual RAG system backend"
requires-python = ">=3.11,<3.13"
dependencies = [
  # Core
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "python-dotenv==1.0.1",
  "tqdm==4.66.5",
  "numpy==1.26.4",
  # Ingestion
  "pypdf==5.1.0",
  "beautifulsoup4==4.12.3",
  "lxml==5.3.0",
  "markdown-it-py==3.0.0",
  # Embeddings + tokenization
  "torch==2.4.1",
  "sentence-transformers==3.2.1",
  "FlagEmbedding==1.3.2",
  "transformers==4.44.2",
  # Vector store
  "faiss-cpu==1.8.0.post1",
  # Language ID
  "fasttext-wheel==0.9.2",
  # LLM providers
  "google-generativeai==0.8.3",
  "openai==1.54.4",
  # API + server
  "fastapi==0.115.4",
  "uvicorn[standard]==0.32.0",
  "sse-starlette==2.1.3",
  "httpx==0.27.2",
  "python-multipart==0.0.12",
  # Corpus fetching
  "wikipedia-api==0.7.1",
  # Evaluation
  "ragas==0.2.6",
  "datasets==2.19.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "ruff==0.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
